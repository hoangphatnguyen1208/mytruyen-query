[project]
name = "mytruyen-query"
version = "0.1.0"
description = "Natural-language query service for MyTruyen"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.116.1",
    "google-genai>=2.24.0",
    "pydantic-settings>=2.10.1",
    "sqlglot>=30.18.0",
    "sqlmodel>=0.0.25",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
